name: Linux ARM64 AppImage

on:
  push:
    branches:
      - edge
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - LICENSE
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Source branch to build
        required: true
        default: fork
        type: choice
        options:
          - fork
          - upstream

concurrency:
  group: linux-aarch64-appimage-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  resolve-source:
    name: Resolve source
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.source.outputs.repository }}
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      release_target: ${{ steps.source.outputs.release_target }}
      should_build: ${{ steps.source.outputs.should_build }}
      source_name: ${{ steps.source.outputs.source_name }}
    steps:
      - name: Resolve source commit
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source || 'fork' }}
          UPSTREAM_REPOSITORY: has207/xenia-edge
          UPSTREAM_BRANCH: edge
        run: |
          set -eu

          source_name="fork"
          repository="$GITHUB_REPOSITORY"
          sha="$GITHUB_SHA"

          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || \
             { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_SOURCE" = "upstream" ]; }; then
            source_name="upstream"
            repository="$UPSTREAM_REPOSITORY"
            sha="$(git ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)"
            if [ -z "$sha" ]; then
              echo "::error::Could not resolve ${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}"
              exit 1
            fi
          fi

          short_sha="$(printf '%s' "$sha" | cut -c1-7)"
          release_target="$sha"
          if [ "$repository" != "$GITHUB_REPOSITORY" ]; then
            release_tag="upstream-edge-${short_sha}"
            release_target="$GITHUB_SHA"
          else
            release_tag="$short_sha"
          fi

          should_build=true
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            should_build=false
            echo "Release $release_tag already exists; skipping build."
          fi

          {
            echo "repository=$repository"
            echo "sha=$sha"
            echo "short_sha=$short_sha"
            echo "release_tag=$release_tag"
            echo "release_target=$release_target"
            echo "should_build=$should_build"
            echo "source_name=$source_name"
          } >> "$GITHUB_OUTPUT"

  build-linux-aarch64-appimage:
    name: Build Linux ARM64 AppImage
    needs: resolve-source
    if: needs.resolve-source.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.resolve-source.outputs.repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          fetch-depth: 0

      - name: Apply local source patches
        env:
          PATCH_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/patches/001-imgui-cjk-font-fallback.patch
        run: |
          set -eu
          patch_file=".github/patches/001-imgui-cjk-font-fallback.patch"
          if [ ! -f "$patch_file" ]; then
            patch_file="/tmp/001-imgui-cjk-font-fallback.patch"
            wget -q "$PATCH_URL" -O "$patch_file"
          fi

          if git apply --check "$patch_file"; then
            git apply "$patch_file"
          elif git apply --reverse --check "$patch_file"; then
            echo "CJK font fallback patch is already applied."
          else
            echo "::error::Could not apply CJK font fallback patch."
            exit 1
          fi

      - name: Cache linuxdeploy tools
        id: cache-linuxdeploy
        uses: actions/cache@v5
        with:
          path: ~/linuxdeploy
          key: ${{ runner.os }}-${{ runner.arch }}-linuxdeploy-tools-aarch64
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-linuxdeploy-

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v5
        with:
          path: .slang
          # Keep in sync with SLANG_VERSION in xenia-build.py.
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Setup
        run: |
          set -eux
          UBUNTU_BASE=$(lsb_release -cs)
          sudo apt-get -y update
          sudo apt-get -y install ca-certificates gnupg software-properties-common wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository -y "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-21 main"
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

          sudo apt-get -y update
          sudo apt-get -y install \
            clang-21 \
            cmake \
            file \
            g++-14 \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfuse2t64 \
            libgtk-3-dev \
            libpulse-dev \
            libudev-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            lld-21 \
            ninja-build \
            wget

          if [ '${{ steps.cache-linuxdeploy.outputs.cache-hit }}' != 'true' ]; then
            mkdir -p ~/linuxdeploy
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage -O ~/linuxdeploy/linuxdeploy
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-aarch64.AppImage -O ~/linuxdeploy/linuxdeploy-plugin-appimage
            chmod +x ~/linuxdeploy/linuxdeploy ~/linuxdeploy/linuxdeploy-plugin-appimage
          fi
          echo "$HOME/linuxdeploy" >> "$GITHUB_PATH"

          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $(grep -oP '(?<=path = )(?!third_party\/DirectXShaderCompiler).+' .gitmodules)
          ./xenia-build.py fetchdata

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build
        env:
          CC: clang-21
          CXX: clang++-21
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: ./xenia-build.py build --config=Release --target=xenia-app

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Prepare AppImage
        id: prepare_appimage
        run: |
          set -eux
          binary=build/bin/Linux/Release/xenia_edge
          if [ "$(stat -c%s "$binary")" -le 100000 ]; then
            echo "::error::Binary is too small."
            exit 1
          fi
          file "$binary"
          if ! file "$binary" | grep -Eqi 'aarch64|arm64'; then
            echo "::error::$binary is not an ARM64 binary."
            exit 1
          fi
          chmod +x "$binary"

          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/16x16/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/32x32/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/48x48/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/64x64/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/128x128/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/256x256/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/512x512/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/1024x1024/apps

          cp assets/icon/16.png artifacts/xenia_edge/usr/share/icons/hicolor/16x16/apps/xenia_edge.png
          cp assets/icon/32.png artifacts/xenia_edge/usr/share/icons/hicolor/32x32/apps/xenia_edge.png
          cp assets/icon/48.png artifacts/xenia_edge/usr/share/icons/hicolor/48x48/apps/xenia_edge.png
          cp assets/icon/64.png artifacts/xenia_edge/usr/share/icons/hicolor/64x64/apps/xenia_edge.png
          cp assets/icon/128.png artifacts/xenia_edge/usr/share/icons/hicolor/128x128/apps/xenia_edge.png
          cp assets/icon/256.png artifacts/xenia_edge/usr/share/icons/hicolor/256x256/apps/xenia_edge.png
          cp assets/icon/512.png artifacts/xenia_edge/usr/share/icons/hicolor/512x512/apps/xenia_edge.png
          cp assets/icon/1024.png artifacts/xenia_edge/usr/share/icons/hicolor/1024x1024/apps/xenia_edge.png

          mkdir -p artifacts/xenia_edge/usr/bin
          linuxdeploy --appdir artifacts/xenia_edge \
            --executable "$binary" \
            --desktop-file assets/xenia_edge.desktop \
            --icon-file assets/icon/256.png \
            --output appimage

          appimage_file=$(find . -maxdepth 1 -name '*.AppImage' -type f | head -n1)
          if [ -z "$appimage_file" ]; then
            echo "::error::AppImage file not found after linuxdeploy"
            exit 1
          fi

          mkdir -p artifacts/release
          mv "$appimage_file" artifacts/release/xenia_edge_linux_aarch64_experimental.AppImage
          chmod +x artifacts/release/xenia_edge_linux_aarch64_experimental.AppImage
          cp LICENSE artifacts/release/

      - name: Upload xenia edge ARM64 AppImage
        if: steps.prepare_appimage.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xenia_edge_linux_aarch64_experimental
          path: artifacts/release
          if-no-files-found: error

      - name: Publish release
        if: steps.prepare_appimage.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          tag="${{ needs.resolve-source.outputs.release_tag }}"
          source_name="${{ needs.resolve-source.outputs.source_name }}"
          source_repository="${{ needs.resolve-source.outputs.repository }}"
          source_sha="${{ needs.resolve-source.outputs.sha }}"
          release_target="${{ needs.resolve-source.outputs.release_target }}"
          appimage="artifacts/release/xenia_edge_linux_aarch64_experimental.AppImage"
          notes="release_notes.md"

          {
            echo "Experimental Linux ARM64 AppImage build."
            echo ""
            echo "Built on Ubuntu 24.04 ARM64 from the edge branch."
            echo "Source: ${source_name} (${source_repository})"
            echo "Source commit: ${source_sha}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$appimage" artifacts/release/LICENSE --clobber
            gh release edit "$tag" \
              --target "$release_target" \
              --title "xenia_edge linux aarch64 experimental" \
              --notes-file "$notes"
          else
            gh release create "$tag" \
              "$appimage" artifacts/release/LICENSE \
              --target "$release_target" \
              --title "xenia_edge linux aarch64 experimental" \
              --notes-file "$notes"
          fi
